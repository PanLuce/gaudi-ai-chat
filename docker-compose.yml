name: openwebui-local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/bootstrap.sh}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *default-logging
    restart: unless-stopped

  # One-shot: creates the per-application databases, idempotent on every `up`.
  db-init:
    image: postgres:18.1-alpine
    command: ["sh", "/ensure-databases.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?run scripts/bootstrap.sh}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?run scripts/bootstrap.sh}
    volumes:
      - ./postgres/ensure-databases.sh:/ensure-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.13.3
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      # Seeds the connection on a fresh database only; afterwards scripts/bootstrap.sh keeps it in sync.
      OPENAI_API_KEY: ${OPENWEBUI_LITELLM_KEY:-}
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      litellm:
        condition: service_healthy
      open-terminal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 2g
    logging: *default-logging
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:v1.108.4
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?run scripts/bootstrap.sh}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "False"
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:?run scripts/bootstrap.sh}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1g
    logging: *default-logging
    restart: unless-stopped

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:0.17.6
    # No published port: reachable only from the compose network as http://open-terminal:8000
    expose:
      - "8000"
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY in .env}
    healthcheck:
      # Endpoints require the API key, so any HTTP response (no -f) means the server is up
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    logging: *default-logging
    restart: unless-stopped

volumes:
  open-webui-data:
  postgres-data:
