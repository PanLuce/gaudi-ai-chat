# Public model names (what people pick in Open WebUI) → provider models.
# Prices come from LiteLLM's built-in price map, so spend is tracked per request.
model_list:
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  # Budget every staff member gets unless set otherwise; created by scripts/bootstrap.sh.
  max_end_user_budget_id: staff-monthly

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Open WebUI sends the signed-in person's e-mail; LiteLLM charges spend and budget to it.
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer
